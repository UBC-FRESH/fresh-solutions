# Tool configuration for Fresh Solutions. Each gate configured here is also a check in the
# green dashboard (scripts/dashboard.py).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fresh-solutions"
version = "0.7.0"
description = "A hybrid metaheuristic engine for hard combinatorial optimisation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "UBC FRESH Lab" }]
dependencies = []

[project.optional-dependencies]
fast = ["numpy>=1.26", "numba>=0.60"]

[tool.hatch.build.targets.wheel]
packages = ["fresh_solutions"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests", "fresh_solutions"]
extend-exclude = ["tmp", "_build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "ANN", "N", "PT", "SIM", "RUF", "C4"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"templates/project/tests/**" = ["D"]
"docs/conf.py" = ["D", "ANN", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "scripts:fresh_solutions"
files = ["scripts", "tests", "fresh_solutions", "docs/conf.py"]
exclude = ["fresh_solutions/adapters/qap_tabu_numba.py"]

[[tool.mypy.overrides]]
module = ["numpydoc", "numpydoc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=scripts --cov=fresh_solutions --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
source = ["scripts", "fresh_solutions"]

[tool.coverage.report]
show_missing = true
omit = [
    "fresh_solutions/adapters/qap_tabu_numba.py",
]
exclude_also = ['if __name__ == "__main__":']
